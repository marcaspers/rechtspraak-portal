name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rechtspraak_portal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, mbstring, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Configure environment for CI
        run: |
          php -r "
          \$env = file_get_contents('.env');
          \$env = str_replace('DB_DATABASE=rechtspraak_portal', 'DB_DATABASE=rechtspraak_portal_test', \$env);
          \$env = str_replace('DB_USERNAME=rechtspraak_portal', 'DB_USERNAME=postgres', \$env);
          \$env = str_replace('DB_PASSWORD=rechtspraak_portal', 'DB_PASSWORD=postgres', \$env);
          file_put_contents('.env', \$env);
          "

      - name: Run Pint (PSR-12)
        run: vendor/bin/pint --test

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test
